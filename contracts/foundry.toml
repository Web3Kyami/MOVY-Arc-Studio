[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
int_types = "long"

# Arc denominations are USDC with 18 decimals, so `forge test --match-contract` and
# `cast` need to be told so explicitly whenever a value is printed or asserted.
[rpc_endpoints]
arcMainnet = "${ARC_MAINNET_RPC_URL}"
arcTestnet = "https://rpc.testnet.arc.io"

[etherscan]
arcMainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer.arc.io/api" }
arcTestnet = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer.testnet.arc.io/api" }
